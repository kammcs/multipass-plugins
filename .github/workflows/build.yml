# Builds every published example, so a reader can trust that what is here
# compiles. It is not the real gate: these examples are built AND RUN by
# the Multipass server's own test suite before they are ever mirrored
# here. This catches the one thing that could still go wrong, which is a
# mirror assembled badly.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build every example to wasm
        run: |
          set -e
          for dir in examples/*/; do
            [ -f "$dir/main.go" ] || continue
            echo "== $dir"
            (cd "$dir" && GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o /tmp/plugin.wasm .)
          done
      - name: Every manifest matches the published schema
        run: python3 .github/check-manifests.py
